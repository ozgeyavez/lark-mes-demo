<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Lark MES</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Manrope:wght@500;600;700;800&display=swap">
<style>/* Yerleşim: OceanMES kabuğu (koyu sol menü + üst şerit + yuvarlak içerik paneli), Lark moru ve altını ile. Tablet öncelikli. */
:root{
  --p950:#1d0b2d;--p900:#2e1446;--p800:#421e5f;--p700:#56287b;--p600:#63338c;--p500:#75439f;--p400:#9668bc;--p300:#bd9bd8;--p200:#dcc8eb;--p100:#efe5f6;--p50:#f8f4fb;
  --g700:#7a5a20;--g600:#9a742b;--g500:#b78f32;--g400:#d2ab52;--g300:#e5c983;--g200:#f1e2bb;--g100:#faf3df;
  --cream:#fcf9f4;--ink:#1c1424;--muted:#6c6477;--line:#e7e0ea;--white:#fff;
  --run:#0b8457;--run-s:#dcf5ea;--stop:#d0234a;--stop-s:#fde4e9;--drain:#d0680b;--drain-s:#fdecd9;--idle:#5d5570;--idle-s:#ece9f0;--warn:#b98300;--warn-s:#fff3cf;
  --disp:"Bricolage Grotesque","Manrope",ui-sans-serif,system-ui,sans-serif;--sans:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;--r-s:9px;color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--p950);color:var(--ink);font:500 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-family:var(--disp);letter-spacing:-.012em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--g400);outline-offset:2px}
img{max-width:100%;display:block}
svg.i{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:12.5px}.b{font-weight:800}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.stack{display:grid;gap:14px}

/* Kabuk */
.shell{display:grid;grid-template-columns:226px minmax(0,1fr);height:100%}
.side{background:linear-gradient(185deg,var(--p800) 0%,var(--p900) 42%,var(--p950) 100%);color:#fff;display:flex;flex-direction:column;padding:18px 12px 12px;gap:18px;overflow:auto}
.top .seg{flex:none}
.side .logo{padding:2px 8px}.side .logo img{height:38px;width:auto}
.nav{display:grid;gap:4px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:11px;padding:11px 12px;white-space:nowrap;border-radius:11px;cursor:pointer;color:#e6daf0;font-weight:700;position:relative}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button:focus-visible{outline:3px solid var(--g400)}
.nav button.on{background:var(--g400);color:var(--p950)}
.nav .cnt{margin-left:auto;background:var(--stop);color:#fff;font-size:11.5px;font-weight:800;border-radius:999px;padding:1px 7px}
.side .foot{margin-top:auto;font-size:11.5px;color:var(--p300);padding:8px;line-height:1.5}
.main{display:flex;flex-direction:column;min-width:0;height:100%}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;color:#fff;background:var(--p950);flex-wrap:wrap}
.chip-top{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--p900);border:0;border-radius:11px;padding:8px 12px;font-weight:700}
.top select.chip-top{appearance:auto;max-width:250px}
.clock{display:flex;align-items:baseline;gap:8px;font-family:var(--disp);font-weight:700;font-size:18px;margin-left:auto}
.clock small{font:600 12px var(--sans);color:var(--p300)}
.bell{position:relative;padding:9px 10px}
.bell b{position:absolute;top:-5px;right:-5px;background:var(--stop);color:#fff;font-size:11px;border-radius:999px;padding:0 6px;line-height:18px}
.panel{flex:1;min-height:0;overflow:auto;background:var(--cream);border-radius:20px 20px 0 0;padding:20px 20px 86px}
.proto-band{background:var(--g200);color:var(--p950);font-size:12px;font-weight:800;padding:5px 16px;text-align:center}
.hamb{display:none}
.scrim-nav{display:none}

/* Başlık ve ortak */
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{font-size:25px;line-height:1.15;color:var(--p900)}
.ph .sub{color:var(--muted);font-size:13px}
.back{all:unset;box-sizing:border-box;width:40px;height:40px;display:grid;place-items:center;border-radius:11px;background:#fff;border:1px solid var(--line);cursor:pointer;color:var(--p700)}
.back:focus-visible{outline:3px solid var(--g400)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 15px;border-radius:11px;border:1px solid transparent;font-weight:800;background:var(--p700);color:#fff;text-align:center}
.btn:hover{background:var(--p600)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.gold{background:var(--g400);color:var(--p950)}.btn.gold:hover{background:var(--g300)}
.btn.ghost{background:#fff;color:var(--p700);border-color:var(--p200)}.btn.ghost:hover{background:var(--p50)}
.btn.run{background:var(--run)}.btn.run:hover{background:#086d48}
.btn.stop{background:var(--stop)}.btn.stop:hover{background:#b01b3d}
.btn.drain{background:var(--drain)}.btn.drain:hover{background:#b4590a}
.btn.big{min-height:62px;font-size:16px;border-radius:13px;padding:12px 18px}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px;border-radius:9px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-weight:800;font-size:12px;white-space:nowrap}
.pill.run{background:var(--run-s);color:#07653f}.pill.stop{background:var(--stop-s);color:#a4153a}.pill.drain{background:var(--drain-s);color:#96490a}.pill.idle{background:var(--idle-s);color:var(--idle)}.pill.warn{background:var(--warn-s);color:#7b5800}.pill.brand{background:var(--p100);color:var(--p700)}.pill.gold{background:var(--g200);color:var(--g700)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{font-size:16px;color:var(--p900)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-weight:800;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.tabs button.on{color:var(--p700);border-color:var(--g500)}
.tabs button:focus-visible{outline:3px solid var(--g400)}
.tabs .c{background:var(--p100);color:var(--p700);font-size:11.5px;border-radius:999px;padding:0 7px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chips button{all:unset;cursor:pointer;display:inline-flex;gap:8px;align-items:center;padding:8px 12px;background:#fff;border:1px solid var(--line);border-radius:11px;font-weight:800;font-size:13px}
.chips button .c{background:var(--idle-s);border-radius:7px;padding:0 7px}
.chips button.on{background:var(--p700);color:#fff;border-color:var(--p700)}.chips button.on .c{background:rgba(255,255,255,.22)}
.chips button:focus-visible{outline:3px solid var(--g400)}
.dot{width:9px;height:9px;border-radius:50%}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--p800);color:#fff;text-align:left;padding:10px 12px;font-weight:700;font-size:12.5px;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
td.num{white-space:nowrap}
tr.err td{background:#fff3f5}tr.wrn td{background:#fffaea}
tr.click{cursor:pointer}tr.click:hover td{background:var(--p50)}
.field{display:grid;gap:5px}.field label,.lbl{font-weight:800;font-size:12.5px;color:var(--p800)}
.inp{width:100%;min-height:44px;padding:9px 12px;border:1.5px solid var(--p200);border-radius:10px;background:#fff}
.inp:focus{outline:0;border-color:var(--p600);box-shadow:0 0 0 3px var(--p100)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.thumb{width:66px;height:44px;border-radius:7px;object-fit:cover;background:var(--p50);flex:none}
.noimg{display:grid;place-items:center;color:var(--p400);background:var(--p50);border-radius:7px;font-size:10px;font-weight:700;text-align:center;line-height:1.1}

/* Üst uyarı bandı */
.due-band{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--g400);color:var(--p950);padding:10px 14px;border-radius:12px;margin-bottom:14px;font-weight:800}
.due-band.late{background:var(--stop);color:#fff}
.due-band .btn{background:var(--p950);color:#fff;min-height:36px;padding:6px 12px}
.due-band.late .btn{background:#fff;color:var(--stop)}

/* Makine / hat kartları */
.lines{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.lc{background:#fff;border-radius:16px;overflow:hidden;border:2px solid var(--idle);display:flex;flex-direction:column;cursor:pointer;transition:transform .12s,box-shadow .12s;text-align:left;padding:0}
.lc:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(46,20,70,.15)}
.lc.run{border-color:var(--run)}.lc.stop{border-color:var(--stop)}.lc.drain{border-color:var(--drain)}
.lc-h{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#fff;background:var(--idle)}
.lc.run .lc-h{background:var(--run)}.lc.stop .lc-h{background:var(--stop)}.lc.drain .lc-h{background:var(--drain)}
.lc-h .code{font:800 21px/1 var(--disp)}
.lc-h .st{margin-left:auto;text-align:right;font-weight:800;font-size:12.5px;line-height:1.25}
.lc-b{padding:12px 14px;display:grid;gap:10px;flex:1}
.lc-prod{display:flex;gap:11px;align-items:center}
.lc-prod .ti{font-weight:800;line-height:1.25;font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--p50);border-radius:12px;padding:9px 4px}
.ring{display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--muted);font-weight:700;text-align:center}
.ring .w{position:relative;width:54px;height:54px}.ring svg{transform:rotate(-90deg);display:block}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:13.5px;color:var(--ink)}
.bar{height:9px;border-radius:9px;background:var(--p100);overflow:hidden}.bar i{display:block;height:100%;background:var(--p600);border-radius:9px}
.lc-f{display:flex;align-items:center;gap:8px;background:var(--p900);color:#fff;padding:9px 12px;font-size:12.5px}
.lc-f .ib{position:relative;display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.12);padding:5px 8px;border-radius:8px;font-weight:700}
.lc-f .ib b{background:var(--stop);border-radius:99px;padding:0 6px;font-size:11px}
.lc-f .ib.due{background:var(--g400);color:var(--p950)}
.lc-f .ib.late{background:var(--stop);color:#fff}
.lc-f .tm{margin-left:auto;font:800 16px var(--disp)}

/* İş detayı */
.detail{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:14px;align-items:start}
.flow{display:flex;align-items:stretch;overflow-x:auto;gap:0;padding-bottom:2px}
.flow .st{flex:1 1 auto;min-width:60px;padding:8px 10px 8px 15px;line-height:1.15;background:var(--p100);color:var(--p800);font-weight:800;font-size:11px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%,10px 50%);text-align:center;margin-right:-5px;display:grid;place-items:center}
.flow .st.g{background:var(--run);color:#fff;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%);padding-left:12px}
.flow .st.c{background:var(--g400);color:var(--p950)}
.gates{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gate{border-radius:14px;padding:14px;display:grid;gap:9px;align-content:start;background:var(--p50);border:1px solid var(--p200)}
.gate.out{background:var(--g100);border-color:var(--g300)}
.gate h4{font:800 15px var(--disp);display:flex;gap:8px;align-items:center;color:var(--p900)}
.gate.dim{opacity:.45}
.gate .btn{width:100%}
.qty{display:grid;grid-template-columns:82px repeat(3,minmax(0,1fr));gap:8px 8px;align-items:end}
.qty .h{font-size:11.5px;color:var(--muted);font-weight:700;padding-left:2px}
.qty .l{font-weight:800;font-size:13px;align-self:center}
.qty .v{padding:8px 10px;border-radius:9px;font:800 16px var(--sans);font-variant-numeric:tabular-nums}
.qty .v1{background:var(--p700);color:#fff}.qty .v2{background:var(--p300);color:var(--p950)}.qty .v3{background:var(--p100);color:var(--p900)}
.hours{display:flex;gap:6px;flex-wrap:wrap}
.hc{min-width:50px;padding:6px 6px;border-radius:9px;text-align:center;font-weight:800;font-size:12px;border:0;line-height:1.2;background:var(--idle-s);color:var(--idle)}
.hc small{display:block;font-weight:800;font-size:11px}
.s-ok{background:var(--run-s);color:#07653f}.s-nok{background:var(--stop);color:#fff}.s-late{background:var(--warn-s);color:#7b5800}.s-due{background:var(--g400);color:var(--p950)}.s-missed{background:var(--p950);color:#fff}.s-stop{background:var(--stop-s);color:#a4153a}.s-idle{background:var(--idle-s);color:var(--idle)}.s-future{background:#fff;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.ntf{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.ntf:first-child{border-top:0}

/* Isı şeridi */
.strip{overflow-x:auto}
.strip table{font-size:12.5px;min-width:380px;table-layout:auto}
.strip th{background:none;color:var(--muted);padding:4px;text-align:center}
.strip th:first-child{text-align:left}
.strip td{border:0;padding:2px}
.strip .cell{border:0;padding:0;box-sizing:border-box;display:grid;place-items:center;width:100%;min-width:26px;height:32px;border-radius:7px;font-weight:800;font-size:13px;cursor:pointer}
.strip .cell:focus-visible{outline:3px solid var(--g500)}
.strip .ln{font-weight:800;white-space:nowrap;padding-right:8px;cursor:pointer;color:var(--p800)}
.legend{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:grid;place-items:center;width:19px;height:19px;border-radius:5px;font-style:normal;font-size:11px;font-weight:800}

/* Ana sayfa */
.home{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{border:0;text-align:left;border-radius:14px;padding:12px 14px;color:#fff;background:var(--p700);display:grid;gap:1px}
.kpi b{font:800 30px/1.05 var(--disp);font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;font-weight:700}
.kpi.k2{background:var(--stop)}.kpi.k3{background:var(--g400);color:var(--p950)}.kpi.k4{background:var(--p900)}
.task{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);flex-wrap:wrap}
.task:first-child{border-top:0}
.task .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--p100);color:var(--p700)}
.task .ic.r{background:var(--stop-s);color:var(--stop)}.task .ic.y{background:var(--g200);color:var(--g700)}.task .ic.o{background:var(--drain-s);color:var(--drain)}
.task .tt{font-weight:800;line-height:1.3}
.empty{padding:26px 12px;text-align:center;color:var(--muted)}

/* Planlama */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
.step{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:9px;align-content:start}
.step .n{font:800 13px var(--sans);color:var(--g700)}
.step h3{font-size:16px;color:var(--p900)}
.drop{display:grid;place-items:center;gap:4px;text-align:center;border:2px dashed var(--p300);border-radius:11px;padding:12px;background:var(--p50);cursor:pointer;font-weight:700;color:var(--p700)}
.drop.on{background:var(--p100);border-color:var(--p600)}
.seg{display:inline-flex;background:var(--p100);border-radius:10px;padding:3px;gap:2px}
.seg button{all:unset;padding:6px 12px;border-radius:8px;font-weight:800;font-size:13px;cursor:pointer;color:var(--p800)}
.seg button.on{background:var(--p700);color:#fff}
.seg button[disabled]{opacity:.5;cursor:not-allowed}
.seg button:focus-visible{outline:3px solid var(--g400)}
.gantt{min-width:760px}
.g-h{display:grid;grid-template-columns:92px 1fr;font-size:11.5px;color:var(--muted);font-weight:700}
.g-t{position:relative;height:20px}.g-t span{position:absolute;transform:translateX(-50%)}.g-t span:first-child{transform:none}
.g-r{display:grid;grid-template-columns:92px 1fr;align-items:center;border-top:1px solid var(--line);min-height:46px}
.g-l{font-weight:800;color:var(--p800)}
.g-b{position:relative;height:38px;background:repeating-linear-gradient(90deg,var(--p50) 0,var(--p50) 1px,transparent 1px,transparent 6.25%)}
.g-j{all:unset;box-sizing:border-box;cursor:pointer;position:absolute;top:3px;bottom:3px;border-radius:7px;color:#fff;font-size:11.5px;font-weight:800;padding:3px 7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:30px;padding-block:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.g-j.gofret{background:var(--p700)}.g-j.kek{background:var(--g600)}.g-j.msh{background:#a33a7b}
.g-j:focus-visible{outline:3px solid var(--g400)}
.g-now{position:absolute;top:0;bottom:0;width:2px;background:var(--stop);z-index:2;pointer-events:none}

/* Kalite */
.q{display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px;align-items:start}
.plist{max-height:640px;overflow:auto;display:grid;gap:2px;margin-top:10px}
.plist button{all:unset;box-sizing:border-box;display:flex;gap:9px;align-items:center;padding:7px;border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:700;line-height:1.25}
.plist button:hover{background:var(--p50)}.plist button.on{background:var(--p100);color:var(--p800)}
.plist button:focus-visible{outline:3px solid var(--g400)}
.plist .thumb{width:44px;height:30px}
.gall{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.med{position:relative;border-radius:10px;overflow:hidden;background:var(--p50);border:1px solid var(--line);aspect-ratio:3/2;max-width:100%}
.med img,.med video{width:100%;height:100%;object-fit:cover;display:block}
.med .tg{position:absolute;left:6px;top:6px;font-size:11px;padding:1px 7px}
.med .x{position:absolute;right:5px;top:5px;border:0;background:rgba(29,11,45,.8);color:#fff;border-radius:7px;width:26px;height:26px;display:grid;place-items:center}
.addm{display:grid;place-items:center;gap:3px;border:2px dashed var(--p300);border-radius:10px;aspect-ratio:3/2;color:var(--p700);font-weight:800;font-size:12.5px;background:var(--p50);cursor:pointer;text-align:center;padding:6px}
.addm input,.up input{position:absolute;width:1px;height:1px;opacity:0}

/* Katman: modal/çekmece */
.ov{position:fixed;inset:0;background:rgba(29,11,45,.62);z-index:50;display:flex;justify-content:center;align-items:center;padding:16px}
.ov.right{justify-content:flex-end;padding:0;align-items:stretch}
.dlg{background:#fff;border-radius:18px;width:100%;max-width:640px;max-height:100%;overflow:auto;box-shadow:0 30px 70px rgba(0,0,0,.4);display:flex;flex-direction:column;min-width:0}
.dlg.wide{max-width:860px}
.ov.right .dlg{border-radius:18px 0 0 18px;max-width:540px;overflow:auto;height:100%}
.dh{display:flex;gap:10px;align-items:center;padding:14px 18px;background:var(--p800);color:#fff;border-radius:18px 18px 0 0;position:sticky;top:0;z-index:3}
.ov.right .dh{border-radius:18px 0 0 0}
.dh h2{font-size:18px}.dh .x{margin-left:auto;background:rgba(255,255,255,.15);border:0;color:#fff;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.db{padding:16px 18px;display:grid;gap:14px}
.df{padding:12px 18px 16px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);background:#fff;position:sticky;bottom:0;border-radius:0 0 18px 18px}
.codes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.code-b{border:1.5px solid var(--p200);background:#fff;border-radius:11px;padding:11px;font-weight:800;min-height:62px;text-align:left;line-height:1.25}
.code-b small{display:block;color:var(--muted);font-weight:700;font-size:11.5px}
.code-b.on{background:var(--p700);border-color:var(--p700);color:#fff}.code-b.on small{color:var(--p200)}
.code-b.un{border-color:#f0b5c2}.code-b.un.on{background:var(--stop);border-color:var(--stop)}.code-b.un.on small{color:#ffdbe3}

/* Kontrol formu */
.crit{border:1.5px solid var(--line);border-radius:13px;padding:12px;display:grid;gap:9px}
.crit.bad{border-color:var(--stop);background:#fff7f9}.crit.good{border-color:#a7dfc6}
.proc{font:800 12px var(--sans);color:var(--g700);letter-spacing:.05em;text-transform:uppercase;margin-top:4px}
.crit .t{font-weight:800;line-height:1.3}
.gauge{position:relative;height:12px;border-radius:7px;background:var(--stop-s);overflow:visible;margin:6px 0 16px}
.gauge .ok{position:absolute;top:0;bottom:0;background:#9fe0c4;border-radius:3px}
.gauge .t{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--run)}
.gauge .m{position:absolute;top:-4px;width:12px;height:20px;margin-left:-6px;border-radius:5px;background:var(--p900);border:2px solid #fff}
.gauge .m.bad{background:var(--stop)}
.gauge .lb{position:absolute;top:15px;font-size:11px;font-weight:700;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.oknok{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.oknok button{min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:800;display:flex;justify-content:center;align-items:center;gap:7px}
.oknok .y.on{background:var(--run);border-color:var(--run);color:#fff}.oknok .n.on{background:var(--stop);border-color:var(--stop);color:#fff}
.up{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:6px 11px;border:1.5px solid var(--p200);border-radius:9px;background:#fff;color:var(--p700);font-weight:800;font-size:13px;cursor:pointer}
.up:hover{background:var(--p50)}.up:focus-within{outline:3px solid var(--g400)}
.mthumbs{display:flex;gap:7px;flex-wrap:wrap}.mthumbs .med{width:88px}
.err-line{color:var(--stop);font-weight:800;font-size:13px}

/* Bildirim kartları */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:70px;z-index:70;background:var(--p950);color:#fff;padding:11px 16px;border-radius:12px;font-weight:700;max-width:min(92vw,520px);box-shadow:0 14px 36px rgba(0,0,0,.35)}
.sms{position:fixed;right:18px;bottom:70px;z-index:65;width:300px;max-width:calc(100vw - 32px);background:var(--p950);border-radius:26px;padding:10px;color:#fff;box-shadow:0 22px 50px rgba(0,0,0,.45)}
.sms .scr{background:#f4f0f7;border-radius:18px;padding:12px;color:var(--ink);display:grid;gap:8px}
.sms .bub{background:#fff;border-radius:12px 12px 12px 3px;padding:9px 11px;font-size:12.5px;line-height:1.4}
.sms .demo{font-size:11px;font-weight:800;color:var(--drain)}
.sms .cl{position:absolute;top:-8px;right:-6px;width:30px;height:30px;border-radius:50%;border:0;background:var(--stop);color:#fff;display:grid;place-items:center}
.demobar{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:40;display:flex;align-items:center;gap:7px;padding:6px 8px 6px 13px;background:var(--p950);color:#fff;border-radius:13px;font-size:12.5px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.35);white-space:nowrap;max-width:calc(100vw - 16px);overflow-x:auto}
.demobar button{border:0;background:var(--g400);color:var(--p950);border-radius:8px;padding:5px 9px;font-weight:800}
.demobar button.alt{background:rgba(255,255,255,.14);color:#fff}
#tip{position:fixed;z-index:90;background:var(--p950);color:#fff;font-size:12px;font-weight:700;padding:6px 9px;border-radius:7px;pointer-events:none;max-width:260px;white-space:pre-line}

/* Verimlilik */
.eff{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.hero .big{background:var(--p800);color:#fff;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px}
.hero .big b{font:800 46px/1 var(--disp)}
.hero .sm{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:5px}
.hero .sm b{font:800 26px/1 var(--disp);color:var(--p900)}
.hero .sm span{font-size:12.5px;font-weight:700;color:var(--muted)}
.par{display:grid;grid-template-columns:minmax(120px,190px) 1fr 54px;gap:8px;align-items:center;padding:5px 0;font-size:13px;font-weight:700}
.par .tr{height:12px;background:transparent}
.par .tr i{display:block;height:100%;background:var(--p600);border-radius:0 4px 4px 0}
.par.un .tr i{background:var(--stop)}
.chart text{font:600 11.5px var(--sans);fill:var(--muted)}
details>summary{cursor:pointer;font-weight:800;color:var(--p700);font-size:13px;padding:6px 0}


/* Soft tema: aynı Lark moru ve altını; açık kabuk, doygunluğu düşük durum renkleri, dolgu yerine açık tonlar. */
:root[data-tone="soft"]{
  --p950:#34254a;--p900:#44305c;--p800:#5a3f78;--p700:#6d4b8f;--p600:#7a5aa0;--p500:#8d70ae;--p400:#a68fc2;--p300:#c9b8dc;--p200:#e0d5ec;--p100:#f0ebf6;--p50:#f9f6fb;

  --cream:#fdfbf8;--line:#ece6f0;
  --run:#2b8565;--run-s:#e1f3ec;--stop:#b84a64;--stop-s:#f9e6ea;--drain:#a8641f;--drain-s:#f9eddf;--idle:#756d88;--idle-s:#efedf3;--warn:#a58a36;--warn-s:#fbf4d9;

.vb-w{overflow-x:auto;padding-top:22px}.vb{position:relative;display:flex;align-items:flex-end;gap:6px;height:230px;padding-bottom:24px}.vb-c{flex:1;min-width:34px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;text-align:center;position:relative}.vb-c.clk{cursor:pointer}.vb-c b{font-size:11px;font-weight:800;color:var(--ink);margin-bottom:2px}.vb-c i{display:block;border-radius:4px 4px 0 0;min-height:2px;position:relative;font-style:normal}.vb-c i em{position:absolute;top:2px;left:0;right:0;color:#fff;font-weight:800;font-style:normal;font-size:11px}.vb-c>span{position:absolute;bottom:-20px;left:-4px;right:-4px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tline{position:absolute;left:0;right:0;border-top:2px dashed var(--ink);z-index:1;pointer-events:none;margin-bottom:24px}.tline span{position:absolute;right:0;top:-18px;font-size:11px;font-weight:800;background:#fff;padding:0 4px;border-radius:4px}
.gb{display:flex;gap:14px;height:230px}.gb-g{flex:1;display:flex;flex-direction:column;min-width:0}.gb-b{flex:1;display:flex;gap:2px;align-items:flex-end;min-height:0}.gb-b .vb-c{min-width:26px}.gb-g>span{text-align:center;font-size:11px;color:var(--muted);padding-top:5px;white-space:nowrap}
.hb{display:grid;gap:9px}.hb-r{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:3px 9px;align-items:center;font-size:13px}.hb-r small{grid-column:1/-1}.unit{margin-top:4px}
.row-stop td{background:var(--stop-s)}.pager{margin-top:10px}.dashg{margin-top:0}.grid2{align-items:start}.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpis.eight{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.kpi b small{font-size:13px;font-weight:700}.kpi em{font-style:normal;display:block}

.form-w{max-width:860px;display:grid;gap:12px}.formbar{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 -6px 22px rgba(40,20,60,.08);flex-wrap:wrap}

/* Giriş ekranı: katmanlı, yavaş hareketli arka plan (ışık bulutları + tam ekran akan şeritler + ipek çizgiler) */
.login{position:relative;overflow:hidden;isolation:isolate;background:radial-gradient(120% 90% at 15% 10%,#4a2370 0%,transparent 60%),linear-gradient(160deg,var(--p800),var(--p950))}
.login-card{position:relative;z-index:2}

@keyframes lgSpin{to{transform:rotate(360deg)}}
@keyframes lgA{0%{transform:translate(0,0) scale(1)}100%{transform:translate(12vmax,9vmax) scale(1.15)}}
@keyframes lgB{0%{transform:translate(0,0) scale(1.05)}100%{transform:translate(-14vmax,10vmax) scale(.9)}}
@keyframes lgC{0%{transform:translate(0,0) scale(.95)}100%{transform:translate(10vmax,-12vmax) scale(1.1)}}
@keyframes lgFlow{to{background-position:1440px 0}}
@media (prefers-reduced-motion:reduce){.lg-bg i{animation:none!important}}
/* Giriş: video arka plan (yüklenemezse yukarıdaki şeritli arka plan görünür) */
.login{z-index:1}
#lgVid{position:fixed;inset:0;z-index:0;display:none;pointer-events:none;background:#0d0618}
.lgv-on:not(.lgv-fail) #lgVid{display:block}
.lgv-on:not(.lgv-fail) .login{background:transparent}
.lgv-on:not(.lgv-fail) .lg-bg{display:none}
#lgVid video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s ease}
#lgVid video.on{opacity:1}
#lgVid::after{content:'';position:absolute;inset:0;background:radial-gradient(70% 70% at 50% 50%,rgba(0,0,0,0) 50%,rgba(0,0,0,.35) 100%)}
.lgv-on:not(.lgv-fail) .login-card{box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06)}
/* satır işlem menüsü ve onay */
.btn.icon-only{padding:6px;min-width:34px;justify-content:center}
.btn.icon-only svg{width:18px;height:18px}
.rmenu{position:fixed;z-index:60;min-width:180px;background:#fff;border:1px solid var(--p100);border-radius:12px;box-shadow:0 14px 40px rgba(40,15,80,.22);padding:6px;display:grid;gap:2px}
.rmenu [role=menuitem]{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;font-weight:700;color:var(--p900)}
.rmenu [role=menuitem]:hover,.rmenu [role=menuitem]:focus-visible{background:var(--p50);outline:0}
.rmenu [role=menuitem].danger{color:var(--stop)}
.rmenu .small{padding:6px 12px}
.btn.danger{background:var(--stop);color:#fff;border-color:var(--stop)}
.btn.danger:hover{filter:brightness(1.08)}
.filters .flt-clr{align-self:flex-end}
/* sütun başlığı: sıralama ve filtre menüsü */
th.cf-th{padding:0}
.cf-btn{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:6px;width:100%;padding:10px 12px;cursor:pointer;font:inherit;color:inherit;white-space:nowrap}
.cf-btn:hover{background:rgba(255,255,255,.08)}
.cf-btn:focus-visible{outline:2px solid var(--g400);outline-offset:-2px}
.cf-ic{display:inline-flex;align-items:center;gap:2px;font-size:10px;opacity:.75}
.cf-ic svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2}
.cf-btn.on .cf-ic{opacity:1;color:var(--g300,#e8c66a)}
.cf-btn.on .cf-ic svg:not(.cf-dd){fill:currentColor}
.cf-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 10px;margin-bottom:8px;border-radius:10px;background:var(--p50);color:var(--p800)}
.cfpop{position:fixed;z-index:61;width:264px;background:#fff;border:1px solid var(--p100);border-radius:12px;box-shadow:0 14px 40px rgba(40,15,80,.22);padding:10px;display:grid;gap:8px}
.cf-sort{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cf-sort button{all:unset;cursor:pointer;text-align:center;padding:7px 6px;border-radius:8px;border:1px solid var(--p100);font-weight:700;font-size:12.5px;color:var(--p900)}
.cf-sort button.on,.cf-sort button:hover{background:var(--p700);color:#fff;border-color:var(--p700)}
.cfpop .cf-q{min-height:34px;padding:6px 10px}
.cf-all{font-weight:700;font-size:13px;display:flex;gap:8px;align-items:center}
.cf-list{max-height:220px;overflow:auto;display:grid;gap:2px;border-top:1px solid var(--p100);padding-top:6px}
.cf-list label{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 2px;border-radius:6px;cursor:pointer}
.cf-list label:hover{background:var(--p50)}
.cf-list label span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cf-list small{color:var(--idle)}
.cf-foot{display:flex;justify-content:flex-end;gap:6px}
.att-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.att-list li{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--p100);border-radius:10px}
.att-list li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-list svg{width:16px;height:16px}
/* modül bazlı menü */
.nav-grp{display:grid;gap:2px;margin-top:6px}
.nav .nav-h{color:#cdb8e2;font-size:12.5px;letter-spacing:.4px;text-transform:uppercase;padding:9px 12px}
.nav .nav-h svg:first-child{width:17px;height:17px;opacity:.8}
.nav .nav-h .chev{margin-left:auto;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;transition:transform .15s}
.nav .nav-h[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.nav-grp.act>.nav-h{color:#fff}
.nav-sub{display:grid;gap:2px;padding-left:14px;border-left:1px solid rgba(255,255,255,.12);margin-left:20px}
.nav-sub button{padding:9px 12px;font-size:14px}

.jpick{display:flex;flex-direction:column;gap:8px}.jp-r{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line,#e3d8ee);border-radius:10px;cursor:pointer}.jp-r:has(input:checked){border-color:var(--p600,#56287B);background:var(--p50,#f6f0fb)}
</style></head>

  if(r==='plan'){const d=new Date();d.setDate(d.getDate()+1);t({k:'Plan',lvl:'y',ico:'plan',title:`${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} planı henüz yüklenmedi`,sub:'Yarının planı bugün 17:00\'ye kadar yayınlanmalı.',btn:'Planı yükle',a:'nav',x:'plan'});S.lines.filter(l=>l.status==='stop').forEach(l=>t({k:'Plan',lvl:'o',ico:'stop',title:`${l.code} duruşu planı etkiliyor`,sub:`${esc(l.job.no)} · kalan ${nf(l.job.plan-l.job.good)} koli`,btn:'Plana git',a:'nav',x:'plan'}))}

const HMAP={tesiskodu:'line',plantarihi:'date',vardiya:'shift',hatkodu:'line',sira:'seq',isemrino:'no',urunkodu:'pcode',partino:'lot',planmiktarkoli:'qty',planbaslangic:'start',baslangictarihi:'date',baslangicsaati:'start',bitistarihi:'edate',bitissaati:'end',plansuredk:'dur',oncelik:'prio',not:'note',ulke:'country'};
const REQ=[['date','Başlangıç Tarihi'],['shift','Vardiya'],['line','Tesis Kodu'],['seq','Sıra'],['no','İş Emri No'],['pcode','Ürün Kodu'],['lot','Parti No'],['qty','Plan Miktar (Koli)'],['start','Başlangıç Saati']];
function parseDateCell(v){
  if(v===''||v==null)return null;
  if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);return d?`${d.y}-${pad(d.m)}-${pad(d.d)}`:null}
  const m=String(v).trim().match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})$/);if(m){const dd=+m[1],mm=+m[2];if(dd<1||dd>31||mm<1||mm>12)return null;return `${m[3]}-${pad(mm)}-${pad(dd)}`}
  const i=String(v).trim().match(/^(\d{4})-(\d{2})-(\d{2})/);return i?i[0]:null;
}
function parseTimeCell(v){
  if(v===''||v==null)return null;
  if(typeof v==='number'){if(v<0||v>=1)return null;const t=Math.round(v*1440);return `${pad(Math.floor(t/60))}:${pad(t%60)}`}
  const m=String(v).trim().match(/^(\d{1,2})[:.](\d{2})$/);if(!m)return null;if(+m[1]>23||+m[2]>59)return null;return `${pad(+m[1])}:${m[2]}`;
}
function readWorkbook(buf,name){
  const wb=XLSX.read(buf,{type:'array'});
  const sn=wb.Sheets['Is_Plani']?'Is_Plani':wb.SheetNames[0];
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
  let hi=rows.slice(0,5).findIndex(r=>r.some(c=>['hatkodu','tesiskodu'].includes(trn(c))));
  if(hi<0)return {fatal:`"${name}" dosyasında "Tesis Kodu" başlığı bulunamadı. Şablonu indirip sütun adlarını değiştirmeden doldurun.`};
  const map=rows[hi].map(c=>HMAP[trn(c)]||null);
  const missing=REQ.filter(([k])=>!map.includes(k)).map(x=>x[1]);
  if(missing.length)return {fatal:`Eksik sütunlar: ${missing.join(', ')}. Şablonun güncel halini indirin.`};
  const data=[];rows.slice(hi+1).forEach((r,i)=>{if(!r.some(c=>String(c).trim()!==''))return;const o={_row:hi+2+i};map.forEach((k,j)=>{if(k)o[k]=typeof r[j]==='string'?r[j].trim():r[j]});data.push(o)});
  return validatePlan(data,name,map.includes('country'));
}
function validatePlan(data,name,hasCountry){
  const seen=new Set();const existing=new Set(S.lines.flatMap(l=>[...(l.job?[l.job]:[]),...l.queue,...l.done]).map(j=>j.no));
  const today=todayStr();const slots={};
  const rows=data.map(o=>{
    const E=[],W=[];const r={row:o._row,src:o,errs:E,warns:W};
    REQ.forEach(([k,lb])=>{if(o[k]===''||o[k]==null)E.push(`${lb} boş`)});
    r.date=parseDateCell(o.date);if(o.date!==''&&!r.date)E.push('Başlangıç Tarihi GG.AA.YYYY olmalı');if(r.date&&r.date<today)W.push('Tarih geçmişte');
    r.shift=Number(o.shift);if(o.shift!==''&&![1,2,3].includes(r.shift))E.push('Vardiya 1, 2 veya 3 olmalı');
    r.lineCode=String(o.line||'').trim().toUpperCase();r.ln=line(r.lineCode);if(o.line!==''&&!r.ln)E.push(`Tanımsız tesis: ${r.lineCode}`);
    r.seq=Number(o.seq);r.no=String(o.no||'').trim();
    if(r.no){if(seen.has(r.no))E.push(`İş emri dosyada tekrar ediyor: ${r.no}`);else if(existing.has(r.no))E.push(`İş emri sistemde var: ${r.no}`);seen.add(r.no)}
    r.pcode=String(o.pcode||'').trim().toUpperCase();r.p=P(r.pcode);if(o.pcode!==''&&!r.p)E.push(`Tanımsız ürün: ${r.pcode}`);
    r.lot=String(o.lot||'').trim();
    r.qty=Number(o.qty);if(o.qty!==''&&!(r.qty>0&&Number.isInteger(r.qty)))E.push('Plan Miktar sıfırdan büyük tam sayı olmalı');
    r.start=parseTimeCell(o.start);if(o.start!==''&&!r.start)E.push('Başlangıç Saati SS:DD olmalı');
    {const has=v=>v!==''&&v!=null;r.edate=has(o.edate)?parseDateCell(o.edate):null;if(has(o.edate)&&!r.edate)E.push('Bitiş Tarihi GG.AA.YYYY olmalı');
    r.end=has(o.end)?parseTimeCell(o.end):null;if(has(o.end)&&!r.end)E.push('Bitiş Saati SS:DD olmalı');
    r.dur=has(o.dur)?Number(o.dur):NaN;if(has(o.dur)&&!(r.dur>0))E.push('Plan Süre sıfırdan büyük olmalı');
    if(!has(o.end)&&!has(o.dur))E.push('Bitiş Saati veya Plan Süre girilmeli');

function trendChart(n,hour){
  const W=460,H=170,L=38,R=68,T=12,B=26;const v=n.trend;const lo=Math.min(n.lsl,...v),hi=Math.max(n.usl,...v);const pd=(hi-lo)*.12||1;const a=lo-pd,b=hi+pd;
  const x=i=>L+i*(W-L-R)/(v.length-1);const y=val=>T+(1-(val-a)/(b-a))*(H-T-B);
  const path=v.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(p).toFixed(1)}`).join(' ');
  const lim=(val,t)=>`<line x1="${L}" x2="${W-R}" y1="${y(val)}" y2="${y(val)}" stroke="var(--stop)" stroke-width="1" stroke-dasharray="4 4"/><text x="${W-R+4}" y="${y(val)+4}">${t} ${nf1(val)}</text>`;
  const labels=v.map((_,i)=>pad((((hour==null?8:hour)-(v.length-1-i))%24+24)%24)+':00');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Son ${v.length} ölçüm, referans ${nf1(n.lsl)}-${nf1(n.usl)} ${esc(n.unit)}">
  <rect x="${L}" y="${y(n.usl)}" width="${W-L-R}" height="${y(n.lsl)-y(n.usl)}" fill="var(--run-s)"/>
  ${lim(n.usl,'Üst')}${lim(n.lsl,'Alt')}
  <path d="${path}" fill="none" stroke="var(--p700)" stroke-width="2" stroke-linejoin="round"/>
  ${v.map((p,i)=>{const bad=p<n.lsl||p>n.usl;return `<circle cx="${x(i)}" cy="${y(p)}" r="${bad?5.5:4}" fill="${bad?'var(--stop)':'var(--p700)'}" stroke="#fff" stroke-width="2" data-tip="${labels[i]}: ${nf1(p)} ${esc(n.unit)}"/>`}).join('')}
  ${v.map((_,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${labels[i]}</text>`).join('')}
  <text x="${L-6}" y="${y(n.tgt)+4}" text-anchor="end">${nf1(n.tgt)}</text></svg>`;
}

function vEff(){

  const A=tot.run/(tot.run+tot.stop),Pf=Math.min(1,tot.ideal/tot.run),Q=tot.good/(tot.good+tot.scrap);const O=A*Pf*Q;
  const sel=line(S.effLine);const pareto={};S.lines.forEach(l=>l.stops.forEach(s=>{pareto[s.code]=(pareto[s.code]||0)+((s.end==null?nowM():s.end)-s.start)}));
  const pl=Object.entries(pareto).sort((a,b)=>b[1]-a[1]);const mx=pl.length?pl[0][1]:1;

  return `<div class="ph"><div><h1>Verimlilik</h1><div class="sub">Çıkış onayları ve beyan edilen duruşlardan hesaplanır. Vardiya başından ${hm(nowM())}'e kadar.</div></div></div>

  <div class="sm"><b class="num">%${Math.round(A*100)}</b><span>Kullanılabilirlik</span></div><div class="sm"><b class="num">%${Math.round(Pf*100)}</b><span>Performans</span></div><div class="sm"><b class="num">%${Math.round(Q*100)}</b><span>Kalite · ${nf(tot.good)} sağlam, ${nf(tot.scrap)} fire koli</span></div></div>
  <div class="eff"><section class="card stack"><div class="row between"><h3>${esc(sel.code)} saatlik çıkış</h3><select class="inp" id="effl" style="width:150px" data-c="effLine" aria-label="Tesis seç">${S.lines.map(l=>`<option ${l.code===sel.code?'selected':''}>${esc(l.code)}</option>`).join('')}</select></div>${hourChart(sel)}</section>

  <section style="margin-top:14px"><div class="tw"><table><thead><tr><th>Tesis</th><th>Durum</th><th>OEE</th><th>Kullanılabilirlik</th><th>Performans</th><th>Kalite</th><th>Çalışma</th><th>Duruş</th><th>Sağlam</th><th>Fire</th><th>Hedef/Saat</th></tr></thead><tbody>${rows.map(l=>{const e=oee(l);const pc=x=>`%${Math.round(x*100)}`;return `<tr class="click" data-a="effSel" data-x="${esc(l.code)}"><td class="b">${esc(l.code)}</td><td><span class="pill ${l.status}">${STL[l.status]}</span></td><td class="b num">${pc(e.O)}</td><td class="num">${pc(e.A)}</td><td class="num">${pc(e.P)}</td><td class="num">${pc(e.Q)}</td><td class="num">${Math.round(e.run)} dk</td><td class="num">${Math.round(e.stop)} dk</td><td class="num">${nf(l.good)}</td><td class="num">${nf(l.scrap)}</td><td class="num">${l.rate}</td></tr>`}).join('')}</tbody></table></div></section>`;

function hourChart(l){
  const [ha,hb]=shiftWin();const cur=Math.floor(nowM()/60);const hrs=[];for(let h=ha;h<=hb;h++)hrs.push(h);
  const W=560,H=240,Lf=36,R=8,T=14,B=26;const maxV=Math.max(l.rate,...hrs.map(h=>l.hourly[h]||0));const top=Math.ceil(maxV*1.15/10)*10;
  const y=v=>T+(1-v/top)*(H-T-B);const bw=(W-Lf-R)/hrs.length;const tks=[0,.5,1].map(f=>Math.round(top*f));
  const bars=hrs.map((h,i)=>{const v=l.hourly[h]||0;const x=Lf+i*bw+bw*.28,w=bw*.44;const tip=`${pad(h)}:00-${pad(h+1)}:00\nÇıkış ${v} koli · Hedef ${l.rate}${h===cur?'\nSaat devam ediyor':''}`;const yt=y(v);const r=Math.min(4,w/2,y(0)-yt);
    return `<g data-tip="${esc(tip)}"><rect x="${Lf+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent"/>${v?`<path d="M${x} ${y(0)}V${yt+r}Q${x} ${yt} ${x+r} ${yt}H${x+w-r}Q${x+w} ${yt} ${x+w} ${yt+r}V${y(0)}Z" fill="${h===cur?'var(--p300)':'var(--p700)'}"/>`:''}</g>`}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="${esc(l.code)} saatlik çıkış ve hedef">
   ${tks.map(t=>`<line x1="${Lf}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${Lf-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`).join('')}
   ${bars}<line x1="${Lf}" x2="${W-R}" y1="${y(l.rate)}" y2="${y(l.rate)}" stroke="var(--ink)" stroke-width="1.500" stroke-dasharray="5 4"/>
   <text x="${W-R}" y="${y(l.rate)-5}" text-anchor="end" style="fill:var(--ink);font-weight:800">Hedef ${l.rate}</text>
   ${hrs.map((h,i)=>`<text x="${Lf+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${pad(h)}</text>`).join('')}</svg>
   <div class="legend"><span><i style="background:var(--p700)"></i>Onaylanan çıkış (koli)</span><span><i style="background:var(--p300)"></i>Devam eden saat</span><span>- - Hedef</span></div>
   <details><summary>Tablo olarak gör</summary><div class="tw"><table><thead><tr><th>Saat</th><th>Çıkış</th><th>Hedef</th><th>Fark</th></tr></thead><tbody>${hrs.filter(h=>h<=cur).map(h=>{const v=l.hourly[h]||0;return `<tr><td class="num">${pad(h)}:00</td><td class="num">${v}</td><td class="num">${l.rate}</td><td class="num">${v-l.rate}</td></tr>`}).join('')}</tbody></table></div></details>`;
}

function chk(c,v){const s=String(v==null?'':v).trim();if(c[2]&&!s)return `${c[1]} boş`;if(!s)return null;const t=c[3];if(t==='fac'&&!line(s))return `Tesis kodu tanımsız: ${s}`;if(t==='sku'&&!P(s))return `Stok kodu tanımsız: ${s}`;if(t==='num'&&isNaN(parseFloat(s.replace(',','.'))))return `${c[1]} sayı olmalı`;if(t==='fab'&&!FABS.some(b=>b.id===s))return `Fabrika kodu tanımsız: ${s}`;if(t==='rt'&&!['Ana','Alternatif'].includes(s))return 'Tür Ana veya Alternatif olmalı';if(t==='ak'&&!['Üretim','Iskarta','Duruş'].includes(s))return 'Tür Üretim, Iskarta veya Duruş olmalı';if(t==='date'&&!toIso(v))return `${c[1]} geçersiz`;return null}
function toIso(v){if(typeof v==='number')return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);const s=String(v).trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const m=s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})$/);return m?`${m[3]}-${pad(m[2])}-${pad(m[1])}`:null}

  const was=ex&&ex.status==='sent';const oldV=was?JSON.stringify(ex.vals):'';const rec=ex||{kind:k,code,slot,form:f.id,shift:curShift().name};Object.assign(rec,{vals:{...d.vals},notes:{...d.notes},media:d.media,sku:d.sku,recipe:d.recipe,recipeVer:d.recipeVer,chg:d.chg||(ex&&ex.chg)||[],by:ME().n,at:hm(nowM()),status:send||was?'sent':'draft'});score(rec,l,f);S.qc[key]=rec;if(was&&oldV!==JSON.stringify(rec.vals))audit('Kalite kaydı düzeltildi',`${code} ${k==='qc'?hm(slot):'günlük'}`,oldV.slice(0,80),JSON.stringify(rec.vals).slice(0,80),why);else if(send)audit('Kalite kaydı gönderildi',`${code} ${k==='qc'?hm(slot):'günlük'}`,'',`${rec.total} alan, ${rec.bad} uygunsuz`);delete S.fd[key];
